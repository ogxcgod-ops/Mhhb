name: Windows Pinggy RDP
on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest

    steps:
      - name: Enable RDP and Firewall
        shell: powershell
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          # Disable NLA (Network Level Authentication)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          # Firewall rule allowing port 3389
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: powershell
        run: |
          $password = "P@ssw0rd123!"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          } else {
            Set-LocalUser -Name "RDP" -Password $securePass
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install OpenSSH Client
        shell: powershell
        run: choco install openssh -y

      - name: Start Pinggy Tunnel (Loop Mode)
        shell: bash
        run: |
          # Define the function to start and monitor the tunnel
          start_tunnel() {
            echo "--------------------------------------------------"
            echo "Starting New Pinggy Tunnel..."
            echo "--------------------------------------------------"
            
            # Start SSH in background, piping output to log file. Using 3389 for RDP.
            ssh -p 443 -R0:127.0.0.1:3389 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 PqsVfbGha7R+tcp@ap.free.pinggy.io | tee pinggy.log &
            TUNNEL_PID=$!
            
            # Wait 10 seconds for the URL to appear
            sleep 10
            
            # Grab and show the new address (the new tunnel address)
            addr=$(grep -oE 'tcp://[a-zA-Z0-9.-]+:[0-9]+' pinggy.log | tail -n1)
            
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "RDP USERNAME: RDP"
            echo "RDP PASSWORD: $RDP_PASSWORD"
            echo "NEW RDP ADDRESS: $addr"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            
            # Wait for the tunnel process to terminate (which it does after ~60 mins)
            wait $TUNNEL_PID
          }

          # Loop endlessly until the 6-hour GitHub Action job limit is reached
          while true; do
            start_tunnel
            echo "Tunnel disconnected (Pinggy limit reached). Restarting in 5 seconds..."
            sleep 5
            # Clear the log for the next run
            echo "" > pinggy.log
          done
